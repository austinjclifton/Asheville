openapi: 3.0.3

info:
  title: Beehive Monitoring API
  version: 1.0.0
  description: |
    API for monitoring beehives and ingesting telemetry data.

    Authentication & security:

    Internal API (/api/*)
    - Session-based authentication via HttpOnly cookie:
      - Cookie: sessionId
    - CSRF protection for authenticated state-changing routes:
      - Header: X-CSRF-Token: <token>
      - Token returned by:
        - POST /api/auth/register
        - POST /api/auth/login
        - GET /api/auth/csrf

    External ingest API (/api/ingest/*)
    - Device telemetry ingest endpoint.
    - If device authentication is enforced, it is validated inside the ingest controller.

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - sessionCookie: []

tags:
  - name: Health
    description: Service status (liveness/readiness)
  - name: Auth
    description: Authentication and account management
  - name: Sessions
    description: Session inspection and invalidation
  - name: Hives
    description: Manage hives (owned by authenticated beekeeper)
  - name: Devices
    description: Manage devices (owned through hive → beekeeper)
  - name: Readings
    description: Read-only telemetry query endpoints
  - name: Ingest
    description: Device telemetry ingestion endpoints

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionId
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    deviceIdHeader:
      type: apiKey
      in: header
      name: X-Device-Id
    deviceKeyHeader:
      type: apiKey
      in: header
      name: X-Device-Key

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    HiveIdPath:
      name: hiveId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    HiveIdQueryRequired:
      name: hiveId
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    SinceQueryRequired:
      name: since
      in: query
      required: true
      schema:
        type: string
        format: date-time

    UntilQuery:
      name: until
      in: query
      required: false
      schema:
        type: string
        format: date-time

    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000

    OrderQuery:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            badRequest:
              value:
                error: Invalid input

    UnauthorizedError:
      description: Not authenticated (missing/invalid session cookie)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthorized:
              value:
                error: Authentication required

    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error: Forbidden

    NotFoundError:
      description: Not found (or not owned by the authenticated user)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              value:
                error: Not found

    ConflictError:
      description: Conflict (duplicate or violates constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            conflict:
              value:
                error: Conflict

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    Success:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean

    HealthLiveness:
      type: object
      additionalProperties: false
      required: [status, timestamp, uptime_s]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        uptime_s:
          type: integer
          minimum: 0

    HealthReadinessOk:
      type: object
      additionalProperties: false
      required: [status, db, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    HealthReadinessDegraded:
      type: object
      additionalProperties: false
      required: [status, db, timestamp]
      properties:
        status:
          type: string
          enum: [degraded]
        db:
          type: string
          enum: [down]
        timestamp:
          type: string
          format: date-time

    User:
      type: object
      additionalProperties: false
      required: [id, username, email, phone, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 32
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string

    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    CsrfResponse:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken:
          type: string

    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    Hive:
      type: object
      additionalProperties: false
      required: [id, beekeeper_id, name, notes, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        beekeeper_id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HiveListResponse:
      type: object
      additionalProperties: false
      required: [hives]
      properties:
        hives:
          type: array
          items:
            $ref: "#/components/schemas/Hive"

    HiveResponse:
      type: object
      additionalProperties: false
      required: [hive]
      properties:
        hive:
          $ref: "#/components/schemas/Hive"

    Device:
      type: object
      additionalProperties: false
      required: [id, hive_id, installed_at, last_seen_at]
      properties:
        id:
          type: integer
          format: int64
        hive_id:
          type: integer
          format: int64
        installed_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true

    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    DeviceResponse:
      type: object
      additionalProperties: false
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"

    Reading:
      type: object
      additionalProperties: false
      required: [id, device_id, recorded_at, temperature_f, battery_voltage, signal_strength, created_at]
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        recorded_at:
          type: string
          format: date-time
        temperature_f:
          type: number
        battery_voltage:
          type: number
          nullable: true
        signal_strength:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time

    ReadingListResponse:
      type: object
      additionalProperties: false
      required: [readings]
      properties:
        readings:
          type: array
          items:
            $ref: "#/components/schemas/Reading"

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveness"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: DB reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadinessOk"
        "503":
          description: DB not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadinessDegraded"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register user and start session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, username, password]
              properties:
                email:
                  type: string
                  maxLength: 254
                username:
                  type: string
                  maxLength: 50
                password:
                  type: string
      responses:
        "201":
          description: User created and session started
          headers:
            Set-Cookie:
              description: HttpOnly session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and start session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Session started
          headers:
            Set-Cookie:
              description: HttpOnly session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/reset-password/request:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 254
      responses:
        "200":
          description: Always returns success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /api/auth/reset-password/confirm:
    post:
      tags: [Auth]
      summary: Confirm password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out current session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags: [Auth]
      summary: Delete current user and all sessions
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/auth/csrf:
    get:
      tags: [Auth]
      summary: Get CSRF token
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/sessions/current:
    get:
      tags: [Sessions]
      summary: Get current session context
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags: [Sessions]
      summary: Invalidate current session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Session destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/sessions:
    delete:
      tags: [Sessions]
      summary: Invalidate all sessions
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: All sessions destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/hives:
    post:
      tags: [Hives]
      summary: Create hive
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Hive created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    get:
      tags: [Hives]
      summary: List hives
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hive list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/hives/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Hives]
      summary: Get hive by id
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Hives]
      summary: Update hive
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Hive updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Hives]
      summary: Delete hive
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Hive deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/hives/{hiveId}/devices:
    parameters:
      - $ref: "#/components/parameters/HiveIdPath"
    post:
      tags: [Devices]
      summary: Create device under hive
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                installedAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    get:
      tags: [Devices]
      summary: List devices under hive
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Devices for hive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/devices:
    get:
      tags: [Devices]
      summary: List all devices
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Devices]
      summary: Get device by id
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Devices]
      summary: Delete device
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Device deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/devices/{id}/last-seen:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Devices]
      summary: Update device last-seen
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/readings/since:
    get:
      tags: [Readings]
      summary: Return readings for a hive since a timestamp
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HiveIdQueryRequired"
        - $ref: "#/components/parameters/SinceQueryRequired"
        - $ref: "#/components/parameters/UntilQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OrderQuery"
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListResponse"
              examples:
                example:
                  value:
                    readings:
                      - id: 100
                        device_id: 12
                        recorded_at: "2026-02-28T18:00:00.000Z"
                        temperature_f: 91.2
                        battery_voltage: 3.71
                        signal_strength: -87
                        created_at: "2026-02-28T18:00:01.000Z"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/readings/latest:
    get:
      tags: [Readings]
      summary: Return the most recent reading for a hive
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HiveIdQueryRequired"
      responses:
        "200":
          description: Latest reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListResponse"
              examples:
                example:
                  value:
                    readings:
                      - id: 101
                        device_id: 12
                        recorded_at: "2026-02-28T18:10:00.000Z"
                        temperature_f: 91.4
                        battery_voltage: 3.70
                        signal_strength: -86
                        created_at: "2026-02-28T18:10:01.000Z"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/ingest/readings:
    post:
      tags: [Ingest]
      summary: Accept telemetry payload from a device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordedAt, temperatureF]
              properties:
                recordedAt:
                  type: string
                  format: date-time
                temperatureF:
                  type: number
                batteryVoltage:
                  type: number
                  nullable: true
                signalStrength:
                  type: number
                  nullable: true
      responses:
        "201":
          description: Reading accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
