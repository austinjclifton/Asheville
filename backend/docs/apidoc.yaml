openapi: 3.0.3

info:
  title: Beehive Monitoring API
  version: 1.0.0
  description: |
    API for monitoring beehives and ingesting telemetry data.

    ## Authentication & Security Model

    This API uses **two distinct security models**:

    **1) Internal API (`/api/*`) — Browser/session based**
    - Authentication is maintained via an **HttpOnly cookie**:
      - Cookie name: `sessionId`
      - Cookie value: the server-issued session token
    - CSRF protection is enforced for **authenticated, state-changing** operations:
      - CSRF token is returned by:
        - `POST /api/auth/register`
        - `POST /api/auth/login`
        - `GET /api/auth/csrf`
      - Clients must send the token on protected requests using:
        - Header: `X-CSRF-Token: <token>`
    - Sessions are **per-device/per-browser**; multiple concurrent sessions are supported.

    **2) External ingest API (`/api/ingest/*`) — Device key**
    - Devices authenticate using headers:
      - `X-Device-Id: <device id>`
      - `X-Device-Key: <device secret>`

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - sessionCookie: []

tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Authentication and account management
  - name: Sessions
    description: Session inspection and invalidation
  - name: Hives
    description: Manage hives (owned by authenticated beekeeper)
  - name: Devices
    description: Manage devices (owned through hive → beekeeper)
  - name: Readings
    description: Read-only telemetry query endpoints
  - name: Ingest
    description: Device telemetry ingestion endpoints

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionId

    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

    deviceIdHeader:
      type: apiKey
      in: header
      name: X-Device-Id

    deviceKeyHeader:
      type: apiKey
      in: header
      name: X-Device-Key

  parameters:
    HiveIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Hive id

    DeviceIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Device id

    ReadingDeviceIdQuery:
      name: deviceId
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Filter readings by a specific device id (owned by the authenticated user)

    ReadingHiveIdQuery:
      name: hiveId
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Filter readings by a specific hive id (owned by the authenticated user)

    ReadingFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Start of time range (inclusive)

    ReadingToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: End of time range (inclusive)

    ReadingLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Max rows to return (server clamps to a safe maximum)

  responses:
    UnauthorizedError:
      description: Not authenticated (missing/invalid session cookie)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notAuthenticated:
              value:
                error: Authentication required

    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error: Forbidden

    NotFoundError:
      description: Resource not found (or not owned by the authenticated user)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              value:
                error: Not found

    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            badRequest:
              value:
                error: Invalid input

    ConflictError:
      description: Conflict (duplicate or violates constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            conflict:
              value:
                error: Conflict

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    Success:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean

    User:
      type: object
      additionalProperties: false
      required: [id, username, email, phone, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 32
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string

    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    CsrfResponse:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken:
          type: string

    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    Hive:
      type: object
      additionalProperties: false
      required: [id, beekeeper_id, name, notes, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        beekeeper_id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Device:
      type: object
      additionalProperties: false
      required: [id, hive_id, installed_at, last_seen_at]
      properties:
        id:
          type: integer
          format: int64
        hive_id:
          type: integer
          format: int64
        installed_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true

    Reading:
      type: object
      additionalProperties: false
      required:
        - id
        - device_id
        - recorded_at
        - temperature_f
        - battery_voltage
        - signal_strength
        - created_at
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        recorded_at:
          type: string
          format: date-time
        temperature_f:
          type: number
        battery_voltage:
          type: number
          nullable: true
        signal_strength:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time

    HiveListResponse:
      type: object
      additionalProperties: false
      required: [hives]
      properties:
        hives:
          type: array
          items:
            $ref: "#/components/schemas/Hive"

    HiveResponse:
      type: object
      additionalProperties: false
      required: [hive]
      properties:
        hive:
          $ref: "#/components/schemas/Hive"

    DeviceListResponse:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    DeviceResponse:
      type: object
      additionalProperties: false
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"

    ReadingListResponse:
      type: object
      additionalProperties: false
      required: [readings]
      properties:
        readings:
          type: array
          items:
            $ref: "#/components/schemas/Reading"

    ReadingStats:
      type: object
      additionalProperties: false
      required: [min, max, avg, count]
      properties:
        min:
          type: number
          nullable: true
          description: Minimum temperature_f in the filtered range (null if no rows)
        max:
          type: number
          nullable: true
          description: Maximum temperature_f in the filtered range (null if no rows)
        avg:
          type: number
          nullable: true
          description: Average temperature_f in the filtered range (null if no rows)
        count:
          type: integer
          description: Number of readings in the filtered range

    ReadingStatsResponse:
      type: object
      additionalProperties: false
      required: [stats]
      properties:
        stats:
          $ref: "#/components/schemas/ReadingStats"

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is running

  # --------------------------------------------------------------------------
  # Auth (PRESERVED)
  # --------------------------------------------------------------------------

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, username, password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
            examples:
              register:
                value:
                  email: user@example.com
                  username: beekeeper1
                  password: "Password123!"
      responses:
        "201":
          description: User created and authenticated session established
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                exists:
                  value:
                    error: User already exists

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username or email (whichever is supported by the server)
                password:
                  type: string
            examples:
              login:
                value:
                  identifier: beekeeper1
                  password: "Password123!"
      responses:
        "200":
          description: Login successful (session cookie set)
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: Missing credentials
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value:
                    error: Invalid credentials

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (invalidate current session)
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Logged out (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
            examples:
              changePassword:
                value:
                  currentPassword: "Password123!"
                  newPassword: "NewPassword123!"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: Not authenticated or invalid current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags: [Auth]
      summary: Delete authenticated user and all sessions
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: User deleted (no content)
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/auth/csrf:
    get:
      tags: [Auth]
      summary: Get CSRF token for current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token returned for current authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/reset-password/request:
    post:
      tags: [Auth]
      summary: Request password reset (no account enumeration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
            examples:
              request:
                value:
                  email: user@example.com
      responses:
        "200":
          description: Always returns success (even if email does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/reset-password/confirm:
    post:
      tags: [Auth]
      summary: Confirm password reset using one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
            examples:
              confirm:
                value:
                  token: "raw-reset-token"
                  newPassword: "NewPassword123!"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid input or invalid/expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --------------------------------------------------------------------------
  # Sessions (PRESERVED)
  # --------------------------------------------------------------------------

  /api/sessions/current:
    get:
      tags: [Sessions]
      summary: Get current session context
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags: [Sessions]
      summary: Invalidate current session (log out this device)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/sessions:
    delete:
      tags: [Sessions]
      summary: Invalidate all sessions for authenticated user (log out of all devices)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All sessions destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # --------------------------------------------------------------------------
  # Hives (UPDATED to match our routes/controllers)
  # --------------------------------------------------------------------------

  /api/hives:
    get:
      tags: [Hives]
      summary: List hives
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hive list (owned by the authenticated beekeeper)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveListResponse"
              examples:
                example:
                  value:
                    hives:
                      - id: 1
                        beekeeper_id: 10
                        name: "Backyard Hive"
                        notes: "Strong colony"
                        created_at: "2026-02-10T10:00:00Z"
                        updated_at: "2026-02-10T10:00:00Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    post:
      tags: [Hives]
      summary: Create hive
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  nullable: true
            examples:
              create:
                value:
                  name: "Backyard Hive"
                  notes: "Installed near the oak tree"
      responses:
        "201":
          description: Hive created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/hives/{id}:
    parameters:
      - $ref: "#/components/parameters/HiveIdPath"
    get:
      tags: [Hives]
      summary: Get hive
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [Hives]
      summary: Update hive (partial)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  nullable: true
            examples:
              rename:
                value:
                  name: "Backyard Hive - North"
              clearNotes:
                value:
                  notes: null
      responses:
        "200":
          description: Hive updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Hives]
      summary: Delete hive
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Hive deleted (no content). Cascades to devices/readings via FK.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --------------------------------------------------------------------------
  # Devices (UPDATED to match our routes/controllers)
  # --------------------------------------------------------------------------

  /api/devices:
    get:
      tags: [Devices]
      summary: List devices
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Device list (owned via hive → beekeeper)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
              examples:
                example:
                  value:
                    devices:
                      - id: 12
                        hive_id: 1
                        installed_at: "2026-02-10T12:00:00Z"
                        last_seen_at: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    post:
      tags: [Devices]
      summary: Create device
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hiveId]
              properties:
                hiveId:
                  type: integer
                  format: int64
                installedAt:
                  type: string
                  format: date-time
                  nullable: true
            examples:
              create:
                value:
                  hiveId: 1
                  installedAt: "2026-02-10T12:00:00Z"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Hive not found (or not owned by user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceIdPath"
    get:
      tags: [Devices]
      summary: Get device
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [Devices]
      summary: Update device (partial)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                installedAt:
                  type: string
                  format: date-time
                  nullable: true
                lastSeenAt:
                  type: string
                  format: date-time
                  nullable: true
            examples:
              setInstalled:
                value:
                  installedAt: "2026-02-10T12:00:00Z"
              setLastSeen:
                value:
                  lastSeenAt: "2026-02-11T09:10:00Z"
              clearInstalled:
                value:
                  installedAt: null
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [Devices]
      summary: Delete device
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Device deleted (no content). Cascades to readings via FK.
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --------------------------------------------------------------------------
  # Readings (UPDATED to match our routes/controllers)
  # --------------------------------------------------------------------------

  /api/readings:
    get:
      tags: [Readings]
      summary: Query readings
      description: |
        Returns readings scoped to the authenticated beekeeper.
        Filters:
        - Provide at most one of deviceId or hiveId.
        - Optional time range with from/to.
        - Optional limit (clamped server-side).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ReadingDeviceIdQuery"
        - $ref: "#/components/parameters/ReadingHiveIdQuery"
        - $ref: "#/components/parameters/ReadingFromQuery"
        - $ref: "#/components/parameters/ReadingToQuery"
        - $ref: "#/components/parameters/ReadingLimitQuery"
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListResponse"
              examples:
                example:
                  value:
                    readings:
                      - id: 100
                        device_id: 12
                        recorded_at: "2026-02-11T09:00:00Z"
                        temperature_f: 91.2
                        battery_voltage: 3.71
                        signal_strength: -87
                        created_at: "2026-02-11T09:00:01Z"
        "400":
          description: Invalid filters (e.g., both deviceId and hiveId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/readings/latest:
    get:
      tags: [Readings]
      summary: Get latest readings
      description: |
        Returns the latest reading per device for the authenticated beekeeper.
        Optional filters:
        - deviceId: returns latest reading for that device only.
        - hiveId: returns latest reading per device within the hive.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ReadingDeviceIdQuery"
        - $ref: "#/components/parameters/ReadingHiveIdQuery"
      responses:
        "200":
          description: Latest readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListResponse"
              examples:
                example:
                  value:
                    readings:
                      - id: 101
                        device_id: 12
                        recorded_at: "2026-02-11T09:10:00Z"
                        temperature_f: 91.4
                        battery_voltage: 3.70
                        signal_strength: -86
                        created_at: "2026-02-11T09:10:01Z"
        "400":
          description: Invalid filters (e.g., both deviceId and hiveId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/readings/stats:
    get:
      tags: [Readings]
      summary: Get reading statistics
      description: |
        Returns aggregate statistics over the filtered reading set.
        Filters:
        - Provide at most one of deviceId or hiveId.
        - Optional time range with from/to.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ReadingDeviceIdQuery"
        - $ref: "#/components/parameters/ReadingHiveIdQuery"
        - $ref: "#/components/parameters/ReadingFromQuery"
        - $ref: "#/components/parameters/ReadingToQuery"
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingStatsResponse"
              examples:
                example:
                  value:
                    stats:
                      min: 88.1
                      max: 94.6
                      avg: 91.3
                      count: 144
        "400":
          description: Invalid filters (e.g., both deviceId and hiveId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # --------------------------------------------------------------------------
  # Ingest (UPDATED + tied to device via headers)
  # --------------------------------------------------------------------------

  /api/ingest/readings:
    post:
      tags: [Ingest]
      summary: Ingest telemetry from device
      description: |
        Device telemetry ingest endpoint.

        Authentication:
        - `X-Device-Id`: device numeric id
        - `X-Device-Key`: device secret (server verifies hash)

        Behavior:
        - Inserts a new reading (append-only)
        - Enforces (device_id, recorded_at) uniqueness at DB level
        - Updates device.last_seen_at on successful ingest (server behavior)
      security:
        - deviceIdHeader: []
          deviceKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordedAt, temperatureF]
              properties:
                recordedAt:
                  type: string
                  format: date-time
                temperatureF:
                  type: number
                batteryVoltage:
                  type: number
                  nullable: true
                signalStrength:
                  type: number
                  nullable: true
            examples:
              ingest:
                value:
                  recordedAt: "2026-02-11T09:10:00Z"
                  temperatureF: 91.4
                  batteryVoltage: 3.70
                  signalStrength: -86
      responses:
        "201":
          description: Reading ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
              examples:
                ok:
                  value:
                    success: true
        "400":
          description: Invalid payload (missing fields, invalid timestamp, out-of-range values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized device (missing/invalid device credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate reading (same deviceId + recordedAt) if server chooses to expose conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
