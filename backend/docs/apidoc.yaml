openapi: 3.0.3

info:
  title: Beehive Monitoring API
  version: 1.0.0
  description: |
    API for monitoring beehives and ingesting telemetry data.

    ## Authentication & Security Model

    This API uses **two distinct security models**:

    **1) Internal API (`/api/*`) — Browser/session based**
    - Authentication is maintained via an **HttpOnly cookie**:
      - Cookie name: `sessionId`
      - Cookie value: the server-issued session token
    - CSRF protection is enforced for **authenticated, state-changing** operations:
      - CSRF token is returned by:
        - `POST /api/auth/register`
        - `POST /api/auth/login`
        - `GET /api/auth/csrf`
      - Clients must send the token on protected requests using:
        - Header: `X-CSRF-Token: <token>`
    - Sessions are **per-device/per-browser**; multiple concurrent sessions are supported.

    **2) External ingest API (`/ingest/*`) — Device key**
    - Devices authenticate using an API key header:
      - Header: `X-INGEST-KEY`

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionId

    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

    ingestKey:
      type: apiKey
      in: header
      name: X-INGEST-KEY

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    Success:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean

    User:
      type: object
      additionalProperties: false
      required: [id, username, email, phone, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 32
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Session:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string

    MeResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    CsrfResponse:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken:
          type: string

    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    Hive:
      type: object
      additionalProperties: false
      required: [id, beekeeper_id, name, notes, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        beekeeper_id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Device:
      type: object
      additionalProperties: false
      required: [id, hive_id, installed_at, last_seen_at, active]
      properties:
        id:
          type: integer
          format: int64
        hive_id:
          type: integer
          format: int64
        installed_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean

    Reading:
      type: object
      additionalProperties: false
      required:
        - id
        - device_id
        - recorded_at
        - temperature_c
        - battery_voltage
        - signal_strength
        - created_at
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        recorded_at:
          type: string
          format: date-time
        temperature_c:
          type: number
        battery_voltage:
          type: number
          nullable: true
        signal_strength:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is running

  /api/auth/register:
    post:
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, username, password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: User created and authenticated session established
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username or email (whichever is supported by the server)
                password:
                  type: string
      responses:
        "200":
          description: Login successful (session cookie set)
          headers:
            Set-Cookie:
              description: Session cookie (HttpOnly)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      summary: Log out (invalidate current session)
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Logged out (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/change-password:
    post:
      summary: Change password
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or invalid current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/me:
    get:
      summary: Get current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete authenticated user and all sessions
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: User deleted (no content)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/csrf:
    get:
      summary: Get CSRF token for current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token returned for current authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/reset-password/request:
    post:
      summary: Request password reset (no account enumeration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Always returns success (even if email does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/reset-password/confirm:
    post:
      summary: Confirm password reset using one-time token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid input or invalid/expired reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sessions/current:
    get:
      summary: Get current session context
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Invalidate current session (log out this device)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sessions:
    delete:
      summary: Invalidate all sessions for authenticated user (log out of all devices)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All sessions destroyed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/hives:
    get:
      summary: List hives
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Hive list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hive"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create hive
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Hive created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hive"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/hives/{hiveId}:
    get:
      summary: Get hive
      security:
        - sessionCookie: []
      parameters:
        - name: hiveId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Hive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hive"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update hive
      security:
        - sessionCookie: []
      parameters:
        - name: hiveId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Hive updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hive"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete hive
      security:
        - sessionCookie: []
      parameters:
        - name: hiveId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Hive deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/devices:
    get:
      summary: List devices
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create device
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hiveId]
              properties:
                hiveId:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/devices/{deviceId}:
    get:
      summary: Get device
      security:
        - sessionCookie: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update device
      security:
        - sessionCookie: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete device
      security:
        - sessionCookie: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Device deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/readings:
    get:
      summary: Query readings
      security:
        - sessionCookie: []
      parameters:
        - name: deviceId
          in: query
          schema:
            type: integer
            format: int64
        - name: hiveId
          in: query
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reading"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/readings/latest:
    get:
      summary: Get latest reading
      security:
        - sessionCookie: []
      parameters:
        - name: deviceId
          in: query
          schema:
            type: integer
            format: int64
        - name: hiveId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Latest reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No readings found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ingest/reading:
    post:
      summary: Ingest telemetry (external)
      security:
        - ingestKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, recordedAt, temperatureC]
              properties:
                deviceId:
                  type: integer
                  format: int64
                recordedAt:
                  type: string
                  format: date-time
                temperatureC:
                  type: number
                batteryVoltage:
                  type: number
                  nullable: true
                signalStrength:
                  type: number
                  nullable: true
      responses:
        "201":
          description: Reading ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reading"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate reading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
