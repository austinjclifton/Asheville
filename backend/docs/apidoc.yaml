openapi: 3.0.3

info:
  title: Beehive Monitoring API
  version: 1.0.0
  description: |
    API for monitoring beehives and ingesting telemetry data.

    Auth model:
    - Internal API (/api/*): session cookie (browser-based)
    - External ingest API (/ingest/*): X-INGEST-KEY header

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionId

    ingestKey:
      type: apiKey
      in: header
      name: X-INGEST-KEY

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string

    Hive:
      type: object
      properties:
        id:
          type: integer
        beekeeper_id:
          type: integer
        name:
          type: string
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: integer
        hive_id:
          type: integer
        installed_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean

    Reading:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: integer
        recorded_at:
          type: string
          format: date-time
        temperature_c:
          type: number
        battery_voltage:
          type: number
          nullable: true
        signal_strength:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is running

  /api/auth/register:
    post:
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [email, username, password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: User created
        "400":
          description: Invalid input
        "409":
          description: User already exists

  /api/auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
        "400":
          description: Missing credentials
        "401":
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Log out
      responses:
        "200":
          description: Logged out

  /api/auth/change-password:
    post:
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password updated
        "401":
          description: Invalid current password

  /api/auth/me:
    get:
      summary: Get current user
      description: Used by frontend on app load to bootstrap auth state
      responses:
        "200":
          description: Authenticated user
        "401":
          description: Not authenticated

  /api/sessions/current:
    get:
      summary: Get current session
      responses:
        "200":
          description: Session info
        "401":
          description: Not authenticated

    delete:
      summary: Invalidate current session
      responses:
        "200":
          description: Session destroyed

  /api/hives:
    get:
      summary: List hives
      responses:
        "200":
          description: Hive list

    post:
      summary: Create hive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [name]
              properties:
                name:
                  type: string
                notes:
                  type: string
      responses:
        "201":
          description: Hive created
        "400":
          description: Invalid input

  /api/hives/{hiveId}:
    get:
      summary: Get hive
      parameters:
        - name: hiveId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hive
        "404":
          description: Hive not found

    put:
      summary: Update hive
      parameters:
        - name: hiveId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                notes:
                  type: string
      responses:
        "200":
          description: Hive updated
        "404":
          description: Hive not found

    delete:
      summary: Delete hive
      parameters:
        - name: hiveId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hive deleted

  /api/devices:
    get:
      summary: List devices
      responses:
        "200":
          description: Device list

    post:
      summary: Create device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [hiveId]
              properties:
                hiveId:
                  type: integer
      responses:
        "201":
          description: Device created
        "404":
          description: Hive not found

  /api/devices/{deviceId}:
    get:
      summary: Get device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device
        "404":
          description: Device not found

    put:
      summary: Update device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Device updated

    delete:
      summary: Delete device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Device deleted

  /api/readings:
    get:
      summary: Query readings
      description: |
        Exactly one of deviceId or hiveId should be provided.
      parameters:
        - name: deviceId
          in: query
          schema:
            type: integer
        - name: hiveId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Readings

  /api/readings/latest:
    get:
      summary: Get latest reading
      description: |
        Exactly one of deviceId or hiveId should be provided.
      parameters:
        - name: deviceId
          in: query
          schema:
            type: integer
        - name: hiveId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Latest reading
        "404":
          description: No readings found

  /ingest/reading:
    post:
      summary: Ingest telemetry (external)
      description: |
        Hardware-facing endpoint. Not used by frontend.
      security:
        - ingestKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [deviceId, recordedAt, temperatureC]
              properties:
                deviceId:
                  type: integer
                recordedAt:
                  type: string
                  format: date-time
                temperatureC:
                  type: number
                batteryVoltage:
                  type: number
                signalStrength:
                  type: number
      responses:
        "201":
          description: Reading ingested
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
        "404":
          description: Device not found or inactive
